spring.application.name=${APPLICATION_NAME:Helpdesk}
server.port=${SERVER_PORT:8054}


# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.example.helpdesk=DEBUG

# ollama
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:codellama:latest}
spring.ai.ollama.chat.options.temperature=0.60
spring.ai.ollama.base-url=http://localhost:11434

